name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install optional dependencies
        run: python -m pip install --disable-pip-version-check yt-dlp yt-dlp-ejs certifi
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
